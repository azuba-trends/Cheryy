[package]
name = "cheryy"
version = "0.1.0"
description = "CHERYY — personal AI office assistant."
authors = ["CHERYY"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "cheryy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
