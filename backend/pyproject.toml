[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cheryy-backend"
version = "0.1.0"
description = "CHERYY backend service - Python core for the CHERYY desktop AI agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CHERYY" }]
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "alembic>=1.13",
  "numpy>=1.26",
  "Pillow>=10.0",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "pdfplumber>=0.10",
  "playwright>=1.42",
  "pywin32>=306; sys_platform == 'win32'",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "pyautogui>=0.9.54",
  "mss>=9.0",
  "comtypes>=1.2; sys_platform == 'win32'",
  "keyring>=24.0",
  "cryptography>=42.0",
  "SpeechRecognition>=3.10",
  "pyttsx3>=2.90; sys_platform == 'win32'",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]

[project.scripts]
cheryy-server = "cheryy.bootstrap:main"
cheryy-cli = "cheryy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cheryy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]